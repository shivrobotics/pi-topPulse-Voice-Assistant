alias: "pi-top Audio Stream to Gemini Pro Pipeline"
description: "Receives raw serial audio chunks from ESPHome pi-top node and routes to Assist Pipeline"
mode: parallel
max: 50

trigger:
  - platform: event
    event_type: esphome.serial_audio_stream
    event_data:
      encoding: pcm16_le_b64

condition: []

action:
  - variables:
      audio_chunk_b64: "{{ trigger.event.data.chunk }}"

  # Direct execution route into Assist Pipeline with Gemini Pro target
  - service: assist_pipeline.run
    data:
      pipeline: "Antigravity Gemini Pro Pipeline"
      start_stage: "intent"
      end_stage: "intent"
      input:
        audio_stream_data: "{{ audio_chunk_b64 }}"
        sample_rate: 16000
        format: "raw_pcm16_le"
